<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>민주노총이 참여하는 정부위원회 전수조사</title>
  <style>
    body { margin:0; font-family:Pretendard, "Noto Sans KR", system-ui, sans-serif; color:#17231f; background:#f7f8f4; }
    #loading { padding:40px; text-align:center; color:#68756f; }
    .no-desc-page td.status { display:table-cell; }
    .no-desc-page td.status.blank { color:#a1aaa5; }
    .no-desc-page .description-content, .no-desc-page .desc-toggle { display:none !important; }
    @media (max-width:650px) {
      .no-desc-page td.status { display:block !important; width:100%; padding-top:0; }
      .no-desc-page td.status::before { content:"현황"; display:block; margin-bottom:2px; color:#68756f; font-size:.7rem; font-weight:800; letter-spacing:.04em; }
      .no-desc-page .group-row td { display:block; width:100%; }
    }
  </style>
</head>
<body>
  <div id="loading">페이지를 불러오는 중입니다.</div>
  <script>
    fetch('index.html')
      .then(response => response.text())
      .then(source => {
        const doc = new DOMParser().parseFromString(source, 'text/html');
        doc.querySelectorAll('th').forEach(cell => { if (cell.textContent.trim() === '설명') cell.remove(); });
        doc.querySelectorAll('td.description').forEach(cell => cell.remove());
        doc.querySelectorAll('.group-row td').forEach(cell => cell.setAttribute('colspan', '2'));
        const body = document.body;
        body.innerHTML = '';
        body.className = 'no-desc-page';
        [...doc.head.querySelectorAll('style, link')].forEach(node => document.head.appendChild(document.importNode(node, true)));
        [...doc.body.children].forEach(node => body.appendChild(document.importNode(node, true)));
        const script = document.createElement('script');
        script.textContent = [...doc.scripts].map(node => node.textContent).join('\n');
        body.appendChild(script);
      })
      .catch(() => { document.querySelector('#loading').textContent = '페이지를 불러오지 못했습니다.'; });
  </script>
</body>
</html>
